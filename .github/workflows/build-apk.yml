name: Build uztove APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: TalkBack fixes
        run: |
          find app/src/main/res/layout -name "*.xml" -print0 2>/dev/null | xargs -0 sed -i \
            -e 's/android:contentDescription="TODO"/android:contentDescription="@string\/more_options"/g' || true

      - name: Rename to uztove
        run: |
          if [ -f app/src/main/res/values/strings.xml ]; then
            sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">uztove<\/string>/' app/src/main/res/values/strings.xml || true
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uztove-debug-apk
          path: "**/*.apk"
          if-no-files-found: warn
          retention-days: 14
