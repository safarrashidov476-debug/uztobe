name: Build uztove APK

on:
  workflow_dispatch:          # Qo‘lda ishga tushirish
  push:
    branches: [ dev, master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Apply TalkBack accessibility fixes
        run: |
          if [ -f scripts/apply-talkback-fixes.sh ]; then
            chmod +x scripts/apply-talkback-fixes.sh
            ./scripts/apply-talkback-fixes.sh || echo "TalkBack script finished with warnings (continuing)"
          else
            echo "TalkBack script not found, applying minimal fixes..."
            # Minimal inline fixes for known TODO contentDescriptions
            find app/src/main/res/layout -name "*.xml" -print0 | xargs -0 sed -i \
              -e 's/android:contentDescription="TODO"/android:contentDescription="@string\/more_options"/g' \
              || true
          fi

      - name: Optionally rename app to uztove
        run: |
          if [ -f scripts/rename-to-uztove.sh ]; then
            chmod +x scripts/rename-to-uztove.sh
            ./scripts/rename-to-uztove.sh || echo "Rename script finished with warnings"
          else
            # Minimal rename: only visible app name
            if [ -f app/src/main/res/values/strings.xml ]; then
              sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">uztove<\/string>/' \
                app/src/main/res/values/strings.xml || true
            fi
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uztove-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload mapping (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/**
            **/reports/**
          retention-days: 7
          if-no-files-found: ignore
